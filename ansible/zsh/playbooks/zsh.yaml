- name: Install ZSH, Oh-my-zsh and Powerlevel10k + fonts
  # Change hosts depending on inventory file.
  hosts: localhost
  vars:
    fzf_version: "0.75.0"
  tasks:
    - name: Install required packages
      ansible.builtin.apt:
        name:
          - zsh
          - fonts-powerline
          - bat
          - ripgrep
        state: present
        update_cache: true
        cache_valid_time: 3600
      become: true

    - name: Print ZSH version
      ansible.builtin.command: zsh --version
      changed_when: false

    - name: Set default shell to zsh
      ansible.builtin.user:
        name: "{{ ansible_user_id }}"
        shell: /bin/zsh
      become: true

    - name: Install Oh-my-zsh
      ansible.builtin.shell: |
        set -o pipefail
        curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh |
          env RUNZSH=no CHSH=no KEEP_ZSHRC=yes sh
      args:
        creates: "{{ ansible_user_dir }}/.oh-my-zsh/oh-my-zsh.sh"
        executable: /bin/bash

    - name: Install Oh-My-ZSH plugins
      ansible.builtin.git:
        repo: 'https://github.com/zsh-users/{{ item }}.git'
        dest: "{{ ansible_user_dir }}/.oh-my-zsh/custom/plugins/{{ item }}"
        version: master
      loop:
        - zsh-syntax-highlighting
        - zsh-autosuggestions

    - name: Install MesloLGS NF fonts
      ansible.builtin.file:
        path: "{{ ansible_user_dir }}/.local/share/fonts"
        state: directory
        mode: u=rwx,go=rx

    - name: Download MesloLGS NF fonts
      ansible.builtin.get_url:
        url: "{{ item.url }}"
        dest: "{{ ansible_user_dir }}/.local/share/fonts/{{ item.name }}"
        mode: u=rw,go=r
      notify: Refresh font cache
      loop:
        - name: MesloLGS NF Regular.ttf
          url: https://raw.githubusercontent.com/romkatv/powerlevel10k-media/master/MesloLGS%20NF%20Regular.ttf
        - name: MesloLGS NF Bold.ttf
          url: https://raw.githubusercontent.com/romkatv/powerlevel10k-media/master/MesloLGS%20NF%20Bold.ttf
        - name: MesloLGS NF Italic.ttf
          url: https://raw.githubusercontent.com/romkatv/powerlevel10k-media/master/MesloLGS%20NF%20Italic.ttf
        - name: MesloLGS NF Bold Italic.ttf
          url: https://raw.githubusercontent.com/romkatv/powerlevel10k-media/master/MesloLGS%20NF%20Bold%20Italic.ttf

    - name: Create fzf extraction directory
      ansible.builtin.file:
        path: "/tmp/fzf-{{ fzf_version }}"
        state: directory
        mode: u=rwx,go=rx

    - name: Download fzf release archive
      ansible.builtin.get_url:
        url: "https://github.com/junegunn/fzf/releases/download/v{{ fzf_version }}/fzf-{{ fzf_version }}-linux_amd64.tar.gz"
        dest: "/tmp/fzf-{{ fzf_version }}.tar.gz"
        mode: u=rw,go=r

    - name: Extract fzf release archive
      ansible.builtin.unarchive:
        src: "/tmp/fzf-{{ fzf_version }}.tar.gz"
        dest: "/tmp/fzf-{{ fzf_version }}"
        remote_src: true
        creates: "/tmp/fzf-{{ fzf_version }}/fzf"

    - name: Install fzf
      ansible.builtin.copy:
        src: "/tmp/fzf-{{ fzf_version }}/fzf"
        dest: /usr/local/bin/fzf
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      become: true

    - name: Install Powerlevel 10k
      ansible.builtin.git:
        repo: 'https://github.com/romkatv/powerlevel10k.git'
        dest: "{{ ansible_user_dir }}/.oh-my-zsh/custom/themes/powerlevel10k"
        depth: 1
        version: master

    - name: Apply predefined p10k.zsh
      ansible.builtin.copy:
        src: dotfiles/.p10k.zsh
        dest: "{{ ansible_user_dir }}/.p10k.zsh"
        mode: u=rw,g=r,o=r

    - name: Apply predefined ~/.zshrc
      ansible.builtin.copy:
        src: dotfiles/.zshrc
        dest: "{{ ansible_user_dir }}/.zshrc"
        mode: u=rw,g=r,o=r
  handlers:
    - name: Refresh font cache
      ansible.builtin.command: fc-cache -f
      changed_when: false
